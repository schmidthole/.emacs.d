set -g status on
set -g status-position top

# status bar styling
set -g status-style bg=default,fg=colour245
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style bg=colour238,fg=colour255,bold
set -g status-left ""
set -g status-right "#{?window_zoomed_flag, [Z] ,} #S "

# padding between status bar and panes
set -g status 2
set -g status-format[1] ''
set -g mouse on
set -g extended-keys on
set -g escape-time 0
set -g history-limit 50000

# prefix
unbind C-b
set -g prefix F12
bind F12 send-prefix
set -g renumber-windows on
set -g set-clipboard on
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour245

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane creation
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# pane destruction
bind q kill-pane

# pane resizing
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# window/workspace management
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind [ previous-window
bind ] next-window
bind c new-window -c "#{pane_current_path}"
bind x kill-window

# window numbering starts at 1
set -g base-index 1
set -g pane-base-index 1

# swap panes
bind S-Left swap-pane -U
bind S-Right swap-pane -D

# copy mode (vim keys)
bind v copy-mode \; set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

bind m resize-pane -Z
bind s choose-session
bind n command-prompt -I "#W" "rename-window '%%'"
bind N command-prompt -I "#S" "rename-session '%%'"
bind C command-prompt "new-session -s '%%'"
bind d detach
